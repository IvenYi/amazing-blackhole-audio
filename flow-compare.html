<style>
*{box-sizing:border-box}body{background:#0c0c0e;color:#eee;margin:0;font:14px/1.6 -apple-system,"PingFang SC",sans-serif}main{max-width:1120px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:20px;font-weight:500;margin:0}a{color:#aaa;text-decoration:none}nav{display:flex;gap:14px;margin:20px 0}button{font:inherit;color:#aaa;border:0;border-bottom:1px solid transparent;padding:9px 14px;background:none;cursor:pointer}button[aria-pressed=true]{color:white;border-color:#eee}.compare{display:flex;justify-content:center;gap:30px}.column{width:393px}.column h2{font-size:15px;font-weight:500;margin:0 0 6px}.column p{color:#999;font-size:12px;margin:0 0 14px}iframe{width:393px;height:852px;border:1px solid #272729;border-radius:24px;display:block;background:#030303}.note{color:#999;font-size:12px;margin:24px auto 0;max-width:816px}@media(max-width:860px){.compare{flex-direction:column;align-items:center}.column,iframe{width:min(393px,calc(100vw - 32px))}main{padding:20px 16px}header a{font-size:12px}}

<main><header><h1>V2 与 V2.1 · 实时对照</h1><a href="./luminous.html?motion=flowing">打开 V2.1 交互预览 ↗</a></header><nav><button data-scene="home">首页</button><button data-scene="recording" aria-pressed="true">录音</button><button data-scene="playback">回放</button></nav><div class="compare"><section class="column"><h2>V2 · 已保存</h2><p>原版光丝、辉光和构图</p><iframe title="V2 保存版"></iframe></section><section class="column"><h2>V2.1 · 增量调整</h2><p>沿流向形变、局部烟雾卷散与黑核受光</p><iframe title="V2.1 增量调整"></iframe></section></div><p class="note">两侧都是正在运行的 WebGL。两侧沿用同一光丝材质；右侧增量调整实际光带、局部烟雾与黑核受光。视觉判断以动态观看为准。</p></main>
<script>
let scene='recording';function update(){document.querySelectorAll('iframe').forEach((frame,i)=>frame.src=`./luminous.html?embed=1&scene=${scene}&motion=${i?'flowing':'continuous'}`);document.querySelectorAll('[data-scene]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.scene===scene)))}
document.querySelectorAll('[data-scene]').forEach(button=>button.onclick=()=>{scene=button.dataset.scene;update()});update();
</script></html>
